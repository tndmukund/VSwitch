name: Build OT Virtual Switch images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for file names"
        default: "1.4.0"
        required: true
  push:
    tags: ["v*"]

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

defaults:
  run:
    working-directory: src/otswitch

jobs:
  amd64-image:
    name: PC and VM image (amd64 img.xz and ova)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        working-directory: ${{ github.workspace }}
        run: unzip -q otswitch.zip -d src && ls src/otswitch
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - name: Install tools
        run: for i in 1 2 3 4 5; do sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 qemu-utils cloud-guest-utils e2fsprogs xz-utils && break; echo retry $i; sleep 30; done; which qemu-img growpart xz
      - name: Build image
        run: sudo bash build/amd64.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: otsw-pc-vm
          path: src/otswitch/out/*
          compression-level: 0
          if-no-files-found: error

  raspberry-pi-image:
    name: Raspberry Pi image (arm64 img.xz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        working-directory: ${{ github.workspace }}
        run: unzip -q otswitch.zip -d src && ls src/otswitch
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install tools
        run: for i in 1 2 3 4 5; do sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 cloud-guest-utils e2fsprogs xz-utils && break; echo retry $i; sleep 30; done; which growpart xz
      - name: Build image
        run: sudo bash build/pi.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: otsw-raspberrypi
          path: src/otswitch/out/*
          compression-level: 0
          if-no-files-found: error

  linux-deb:
    name: Linux installer (deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        working-directory: ${{ github.workspace }}
        run: unzip -q otswitch.zip -d src && ls src/otswitch
      - name: Build deb
        run: bash build/deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: otsw-linux-deb
          path: src/otswitch/out/*.deb
          if-no-files-found: error

  tool:
    name: Switch Tool (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            sep: ";"
            exe: OT-Switch-Tool
          - os: ubuntu-24.04
            os_name: linux
            sep: ":"
            exe: OT-Switch-Tool-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack project
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python -m zipfile -e otswitch.zip src
      - name: Build single-file app
        shell: bash
        run: pip install pyinstaller && pyinstaller --onefile --windowed --name ${{ matrix.exe }} --paths app --add-data "app/index.html${{ matrix.sep }}." --add-data "app/server.py${{ matrix.sep }}." --add-data "app/flows.py${{ matrix.sep }}." --add-data "app/license.py${{ matrix.sep }}." --hidden-import flows --hidden-import license launcher/otsw_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: otsw-tool-${{ matrix.os_name }}
          path: src/otswitch/dist/*
          if-no-files-found: error

  vendor-licensor:
    name: Licence generator (vendor only, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack project
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python -m zipfile -e otswitch.zip src
      - name: Build licence generator
        shell: bash
        working-directory: src/otswitch
        run: pip install pyinstaller && pyinstaller --onefile --windowed --name OT-Switch-Licence-Generator --paths app tools/otsw_licensor.py
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-licensor-windows
          path: src/otswitch/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [amd64-image, raspberry-pi-image, linux-deb, tool]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/dl
          pattern: otsw-*
          merge-multiple: true
      - name: List files
        working-directory: ${{ github.workspace }}
        run: ls -lh dl
      - name: Pack everything into one zip
        working-directory: ${{ github.workspace }}
        run: printf 'OT Virtual Switch - what is in this zip\n\notsw-*-amd64.ova VMware ESXi / Workstation (import as a VM)\notsw-*-amd64.img.xz PC / laptop / USB or any hypervisor (flash with balenaEtcher or Rufus)\notsw-*-raspberrypi-arm64.img.xz Raspberry Pi 3/4/5 (flash with Raspberry Pi Imager)\not-virtual-switch_*_all.deb Ubuntu/Debian installer\nOT-Switch-Tool.exe Windows finder and demo\nOT-Switch-Tool-linux Linux finder and demo\n' > dl/READ-ME.txt && cd dl && zip -0 -r ../OT-Virtual-Switch-all.zip . && ls -lh ../OT-Virtual-Switch-all.zip && if [ $(stat -c%s ../OT-Virtual-Switch-all.zip) -lt 1900000000 ]; then mv ../OT-Virtual-Switch-all.zip ./; else echo "all-in-one zip is over the 2 GB release limit - skipped, use the separate files"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}-build{1}', github.event.inputs.version, github.run_number) }}
          name: OT Virtual Switch ${{ github.event.inputs.version || github.ref_name }}
          files: dl/*
          body: "Download the file for your platform. img.xz = flash to USB/SD card, ova = import into VMware ESXi or Workstation, deb = install on Ubuntu/Debian, OT-Switch-Tool = find the switch on your network or try the demo."
